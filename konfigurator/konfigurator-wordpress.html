<style>

.rk .rk-incl-title::before { content: none !important; }

.rk .rk-bar { display: none; }

.rk .s-ink { stroke: var(--rk-ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

@media (max-width: 820px) {
  .rk .rk-grid { grid-template-columns: minmax(0, 1fr); }

</style>

<script>
(function () {
  var C = window.RK_CONFIG, root = document.getElementById("rk-konfigurator");
  if (!C || !root) return;
  var $ = function (id) { return root.querySelector("#" + id); };
  var stan = { rodzaj: C.rodzaje[0].id, osoby: 2, pupile: 0 };
  function zl(n) { return n.toLocaleString("pl-PL") + " " + C.waluta; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function rodzaj() { return C.rodzaje.filter(function (r) { return r.id === stan.rodzaj; })[0]; }
  function minOsob(r) { return r.osobyWCenie || 0; }

  // Rodzaje ilustracji
  C.rodzaje.forEach(function (r, i) {
    var lab = document.createElement("label");
    lab.className = "rk-opt"; lab.htmlFor = "rk-r-" + r.id;
    lab.innerHTML = '<input type="radio" name="rk-rodzaj" id="rk-r-' + esc(r.id) + '" value="' + esc(r.id) + '"' + (i === 0 ? " checked" : "") + '>' +
      '<span class="rk-mark"></span><span class="rk-name">' + esc(r.nazwa) + "<small>" + esc(r.opis || "") + '</small></span>' +
      '<span class="rk-price">' + (r.osobyWCenie ? "od " : "") + zl(r.cena) + "</span>";
    $("rk-rodzaje").appendChild(lab);
  });
  $("rk-rodzaje").addEventListener("change", function (e) {
    var poprz = rodzaj();
    stan.rodzaj = e.target.value;
    var r = rodzaj();
    if (!!poprz.osobyWCenie !== !!r.osobyWCenie) stan.osoby = r.osobyWCenie ? 2 : 0;
    odswiez();
  });

  // Liczniki osób i pupili
  [["osoby", -1], ["osoby", 1], ["pupile", -1], ["pupile", 1]].forEach(function (a) {
    $("rk-" + a[0] + (a[1] < 0 ? "-minus" : "-plus")).addEventListener("click", function () {
      var r = rodzaj(), min = a[0] === "osoby" ? minOsob(r) : 0, max = a[0] === "osoby" ? C.maxOsob : C.maxPupili;
      stan[a[0]] = Math.max(min, Math.min(max, stan[a[0]] + a[1]));
      odswiez();
    });
  });
  $("rk-wydruk").addEventListener("change", odswiez);
  $("rk-format").addEventListener("change", odswiez);
  var W = C.wydruki, najtaniej = function (m) { return Math.min.apply(null, W.formaty.map(function (f) { return f[m]; })); };
  $("rk-w-papier-cena").textContent = "od " + zl(najtaniej("papier"));
  $("rk-w-plotno-cena").textContent = "od " + zl(najtaniej("plotno"));
  $("rk-przesylka").textContent = "Do wydruku doliczana jest przesyłka: " + zl(W.przesylka) + ".";
  function material() { var r = root.querySelector('input[name="rk-wydruk"]:checked'); return r ? r.value : ""; }
  $("rk-form").addEventListener("submit", function (e) { e.preventDefault(); });

  // Poprawki
  $("rk-poprawki-wstep").textContent = C.poprawki.wstep;
  $("rk-poprawki-tytul").textContent = C.poprawki.tytulListy || "";
  $("rk-poprawki-lista").innerHTML = C.poprawki.lista.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");

  // Rysowany schemat w stylu serca z liśćmi — znika, gdy w RK_CONFIG.obrazki jest adres prawdziwego obrazka
  var farby = ["#efc2c4", "#aec8dc", "#cddcb9", "#f1d7a8", "#d9c4e6", "#f3b9a0"];
  function serce(cx, cy, sk, n, pupile, wariant, napis) {
    var o = '<g transform="translate(' + cx + " " + cy + ") scale(" + sk + ')">';
    o += '<path class="s-heart" d="M0 112 C -60 64 -130 14 -126 -44 C -122 -100 -46 -112 0 -62 C 46 -112 122 -100 126 -44 C 130 14 60 64 0 112"/>';
    var pk = [[-126, -44, 80], [-112, -88, 20], [-74, -104, -20], [-30, -88, -50], [30, -88, 50], [74, -104, 20], [112, -88, -20], [126, -44, -80], [104, 14, -120], [-104, 14, 120], [58, 66, -140], [-58, 66, 140]];
    pk.forEach(function (p, i) {
      if (wariant === "zainteresowania") {
        o += '<rect x="' + (p[0] - 9) + '" y="' + (p[1] - 9) + '" width="18" height="18" rx="3" fill="' + farby[i % farby.length] + '" stroke="#6a6f7d" stroke-width="1"/>';
      } else {
        o += '<ellipse cx="' + p[0] + '" cy="' + p[1] + '" rx="10" ry="4" fill="#b7cba6" transform="rotate(' + p[2] + " " + p[0] + " " + p[1] + ')"/>';
        if (i % 3 === 0) o += '<circle cx="' + (p[0] + 6) + '" cy="' + (p[1] + 8) + '" r="4" fill="#fff" stroke="#c9d3bd"/>';
      }
    });
    var ground = 52, s = n <= 2 ? 1 : n === 3 ? 0.86 : n === 4 ? 0.76 : 0.64, szer = Math.min(190, 56 * n * s + (pupile ? 30 : 0));
    var start = -szer / 2, krok = (szer - (pupile ? 30 : 0)) / Math.max(n, 1);
    for (var i = 0; i < n; i++) {
      var x = start + krok * (i + 0.5), h = 118 * s, top = ground - h, f = farby[i % farby.length];
      var cialo = i % 2 === 0
        ? "M" + (x - 8 * s) + " " + (top + 24 * s) + " L" + (x + 8 * s) + " " + (top + 24 * s) + " L" + (x + 26 * s) + " " + ground + " L" + (x - 26 * s) + " " + ground + " Z"
        : "M" + (x - 15 * s) + " " + (top + 24 * s) + " H" + (x + 15 * s) + " V" + ground + " H" + (x - 15 * s) + " Z";
      o += '<path class="s-ink" fill="' + f + '" d="' + cialo + '"/>';
      o += '<circle class="s-ink" fill="#f6e3d3" cx="' + x + '" cy="' + (top + 11 * s) + '" r="' + 13 * s + '"/>';
    }
    for (var p = 0; p < pupile; p++) {
      var px = szer / 2 - 14 - p * 9, py = ground - 8 - p * 16;
      o += '<ellipse class="s-ink" fill="#d6b28c" cx="' + px + '" cy="' + py + '" rx="12" ry="7"/>';
      o += '<circle class="s-ink" fill="#d6b28c" cx="' + (px + 11) + '" cy="' + (py - 9) + '" r="6"/>';
    }
    o += '<path d="M-74 58 H74 L64 70 L74 82 H-74 L-64 70 Z" fill="#f7f1ea" stroke="#d8cfc4"/>';
    o += '<text class="s-hand" x="0" y="77" font-size="17" text-anchor="middle">' + esc(napis) + "</text>";
    return o + "</g>";
  }
  function szkic(r) {
    var svg = '<svg viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schemat przykładowej ilustracji"><rect width="300" height="380" fill="#fdfdfc"/>';
    if (r.id === "zestaw") {
      var dod = stan.osoby;
      svg += serce(80, 120, 0.5, 4 + dod, stan.pupile, "podstawowy", "Kochani Rodzice");
      svg += serce(220, 120, 0.5, 4 + dod, stan.pupile, "podstawowy", "Kochani Rodzice");
      svg += serce(150, 268, 0.5, 2, 0, "podstawowy", "Klaudia i Jeremi");
    } else {
      svg += serce(150, 190, 1, stan.osoby, stan.pupile, r.id, "M+A=♡");
    }
    return svg + "</svg>";
  }

  function odmiana(n, a, b, c) { return n === 1 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? b : c; }

  function odswiez() {
    var r = rodzaj(), dodOsob = Math.max(0, stan.osoby - r.osobyWCenie), suma = r.cena + dodOsob * C.kolejnaOsoba + stan.pupile * C.pupil;
    var linie = [[r.nazwa + (r.osobyWCenie ? " (" + r.osobyWCenie + " " + odmiana(r.osobyWCenie, "osoba", "osoby", "osób") + ")" : ""), zl(r.cena)]];
    if (dodOsob) linie.push(["Kolejne osoby: " + dodOsob + " × " + zl(C.kolejnaOsoba), "+ " + zl(dodOsob * C.kolejnaOsoba)]);
    if (stan.pupile) linie.push(["Pupile: " + stan.pupile + " × " + zl(C.pupil), "+ " + zl(stan.pupile * C.pupil)]);
    var m = material(), sel = $("rk-format"), idx = sel.selectedIndex < 0 ? 0 : sel.selectedIndex;
    sel.innerHTML = m ? W.formaty.map(function (f) { return "<option>" + esc(f.nazwa + " – " + zl(f[m])) + "</option>"; }).join("") : "";
    sel.selectedIndex = idx;
    $("rk-format-box").hidden = !m;
    if (m) {
      var f = W.formaty[idx];
      suma += f[m] + W.przesylka;
      linie.push(["Wydruk na " + (m === "plotno" ? "płótnie" : "papierze") + ", " + f.nazwa, "+ " + zl(f[m])]);
      linie.push(["Przesyłka", "+ " + zl(W.przesylka)]);
    }

    $("rk-total").textContent = zl(suma);
    $("rk-bar-total").textContent = zl(suma);
    $("rk-lines").innerHTML = linie.map(function (l) { return "<li><span>" + esc(l[0]) + "</span><span>" + esc(l[1]) + "</span></li>"; }).join("");
    $("rk-incl").innerHTML = '<li class="rk-incl-title">W cenie</li>' + r.wCenie.concat([C.wspolneWCenie]).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    $("rk-note").hidden = true;

    $("rk-osoby").textContent = stan.osoby;
    $("rk-pupile").textContent = stan.pupile;
    $("rk-osoby-label").textContent = r.etykietaOsob || "Liczba osób";
    $("rk-osoby-cena").textContent = "+ " + zl(C.kolejnaOsoba) + " / kolejna";
    $("rk-pupile-cena").textContent = "+ " + zl(C.pupil) + " / pupil";
    $("rk-osoby-minus").disabled = stan.osoby <= minOsob(r);
    $("rk-osoby-plus").disabled = stan.osoby >= C.maxOsob;
    $("rk-pupile-minus").disabled = stan.pupile <= 0;
    $("rk-pupile-plus").disabled = stan.pupile >= C.maxPupili;
    $("rk-hint").textContent = r.uwaga || (stan.osoby >= C.maxOsob ? "Więcej osób? Napisz do mnie wiadomość." : "");

    var opis = [r.nazwa];
    if (r.id !== "zestaw") opis.push(stan.osoby + " " + odmiana(stan.osoby, "osoba", "osoby", "osób"));
    else if (stan.osoby) opis.push("+" + stan.osoby + " " + odmiana(stan.osoby, "osoba", "osoby", "osób"));
    if (stan.pupile) opis.push(stan.pupile + " " + odmiana(stan.pupile, "pupil", "pupile", "pupili"));
    $("rk-caption").textContent = opis.join(" · ");

    var ob = C.obrazki || {}, url = ob[r.id + "-" + stan.osoby + "-" + stan.pupile] || ob[r.id];
    $("rk-img").innerHTML = (url ? '<img src="' + esc(url) + '" alt="Przykładowa ilustracja: ' + esc(opis.join(", ")) + '">' : szkic(r)) +
      '<span class="rk-chip">przykład</span>';
  }

  odswiez();
})();
</script>
